apiVersion: apps/v1
kind: Deployment
metadata:
  name: xdc-subnet-bootnode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xdc-subnet-bootnode
  template:
    metadata:
      labels:
        app: xdc-subnet-bootnode
    spec:
      containers:
        - name: bootnode
          image: anunayxin/xdc-subnet:bootnode
          imagePullPolicy: Always
          command: ["bash", "/work/start-bootnode.sh"]
          env:
            - name: DISABLE_EXTIP
              value: "1"
            - name: NET_RESTRICTING
              value: "10.0.0.0/8"
            - name: BOOTNODES_FILE
              value: "/work/bootnode/bootnodes.list"
            - name: NODEKEY_FILE
              value: "/work/bootnode/bootnode.key"
            - name: BOOTNODE_ENODE_OUT
              value: "/work/bootnode/bootnode.enode"
            - name: LOG_FILE
              value: "/work/bootnode/bootnode.log"
            - name: VERBOSITY
              value: "3"
          ports:
            - containerPort: 30301
              name: discovery-udp
              protocol: UDP
            - containerPort: 30301
              name: discovery-tcp
              protocol: TCP
          volumeMounts:
            - name: bootnodes-list
              mountPath: /work/bootnode/bootnodes.list
              subPath: bootnodes.list
            - name: bootnode-data
              mountPath: /work/bootnode
      volumes:
        - name: bootnodes-list
          configMap:
            name: subnet-bootnode-seeds
        - name: bootnode-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: xdc-subnet-bootnode
spec:
  selector:
    app: xdc-subnet-bootnode
  ports:
    - name: discovery-udp
      port: 30301
      targetPort: 30301
      protocol: UDP
    - name: discovery-tcp
      port: 30301
      targetPort: 30301
      protocol: TCP
